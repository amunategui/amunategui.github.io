const $ = id => document.getElementById(id);
const DIALS = [
  { id:'bpm',    label:'Tempo',  min:40, max:120, step:1,  fmt:v => Math.round(v) + ' bpm' },
  { id:'weight', label:'Low end',min:0,  max:1,   step:.01,fmt:v => Math.round(v * 100) },
  { id:'tone',   label:'Air',    min:0,  max:1,   step:.01,fmt:v => Math.round(v * 100) },
  { id:'space',  label:'Space',  min:0,  max:1,   step:.01,fmt:v => Math.round(v * 100) },
  { id:'motion', label:'Motion', min:0,  max:1,   step:.01,fmt:v => Math.round(v * 100) },
  { id:'width',  label:'Width',  min:0,  max:1.8, step:.01,fmt:v => Math.round(v * 100) },
  { id:'volume', label:'Level',  min:0,  max:1,   step:.01,fmt:v => Math.round(v * 100) }
];
const LAYER_LABELS = {
  pad:'Pads', bass:'Bass', lead:'Melody', counter:'Strings',
  seq:'Sequence', key:'Keys', air:'Air', drone:'Drone'
};

const UI = {
  build(){
    const sw = $('scenes');
    SCENES.forEach(sc => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = sc.name; b.dataset.id = sc.id;
      b.onclick = () => { applyScene(sc); if(!S.playing) play(); };
      sw.appendChild(b);
    });

    const dw = $('dials');
    DIALS.forEach(d => {
      const wrap = document.createElement('label');
      wrap.className = 'dial';
      wrap.innerHTML = '<span>' + d.label + '<em></em></span>';
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step;
      inp.value = P[d.id];
      inp.oninput = () => {
        const v = parseFloat(inp.value);
        P[d.id] = v;
        if(AC){
          if(d.id === 'volume' && S.playing) masterOut.gain.setTargetAtTime(v, AC.currentTime, .12);
          if(d.id === 'bpm'){ updateEcho(); linkState(); }
          if(d.id === 'motion' || d.id === 'tone' || d.id === 'space' || d.id === 'width') applyField(false);
        }
        d.out.textContent = d.fmt(v);
      };
      wrap.appendChild(inp);
      d.el = inp; d.out = wrap.querySelector('em');
      d.out.textContent = d.fmt(P[d.id]);
      dw.appendChild(wrap);
    });

    const lw = $('layers');
    Object.keys(LAYER_LABELS).forEach(k => {
      const l = document.createElement('label');
      l.className = 'layer' + (LAYERS[k] ? ' on' : '');
      l.innerHTML = '<input type="checkbox"' + (LAYERS[k] ? ' checked' : '') + '><span class="dot"></span><span>' + LAYER_LABELS[k] + '</span>';
      const inp = l.querySelector('input');
      inp.onchange = () => setLayer(k, inp.checked);
      LAYER_EL[k] = { inp, l };
      lw.appendChild(l);
    });

    $('play').onclick = () => S.playing ? pause() : play();
    $('newBtn').onclick = () => { newPiece(); if(!S.playing) play(); };
    $('driftBtn').onclick = () => { if(ready) nextPassage(AC.currentTime + .4); };
    $('recBtn').onclick = toggleRec;
    $('tracksBtn').onclick = () => showTracks(!TRK.show);
    $('driftToggle').onclick = () => {
      FIELD.drift = !FIELD.drift;
      if(FIELD.drift){ FIELD.ax = FIELD.x; FIELD.ay = FIELD.y; FIELD.t0 = Math.random() * 1000; }
      else { FIELD.tx = FIELD.x; FIELD.ty = FIELD.y; }
      UI.chips();
    };

    addEventListener('keydown', e => {
      if(e.target.tagName === 'INPUT') return;
      if(e.code === 'Space'){ e.preventDefault(); S.playing ? pause() : play(); }
      if(e.key === 'n'){ newPiece(); }
      if(e.key === 'd'){ $('driftToggle').click(); }
      if(e.key === 't'){ showTracks(!TRK.show); }
    });
  },
  chips(){
    const dt = $('driftToggle');
    dt.classList.toggle('on', FIELD.drift);
    dt.textContent = FIELD.drift ? 'drifting' : 'held';
  },
  sync(){
    DIALS.forEach(d => { if(d.el){ d.el.value = P[d.id]; d.out.textContent = d.fmt(P[d.id]); } });
    this.chips();
    if(ready) applyField(false);
  },
  piece(){
    const t = S.title.split(' ');
    $('title').innerHTML = t[0] + ' <i>' + t.slice(1).join(' ') + '</i>';
    $('sub').textContent = PC[S.root] + ' ' + MODE_LABEL[S.scaleName] + ' · melodic field · seed ' + S.seed;
    $('roKey').textContent = PC[S.root] + ' ' + MODE_LABEL[S.scaleName];
    this.readout();
  },
  readout(){
    const c = S.bars.length ? chordAt(Math.max(0, S.bar - 1)) : null;
    if(c) $('roChord').textContent = c.chord.label;
    $('roSec').textContent = PASSAGES[S.passage].label;
    $('roBar').textContent = S.playing ? ((S.bar + S.barsBuilt) % 1000) : '—';
    const np = $('nowplaying');
    np.textContent = S.playing ? PASSAGES[S.passage].label : '';
    np.classList.toggle('on', S.playing);
  },
  transport(){
    $('play').classList.toggle('on', S.playing);
    $('tState').textContent = S.playing ? 'Playing' : 'Start';
    $('tSub').textContent = S.playing ? S.title.toLowerCase() : 'nothing is playing';
    $('card').style.opacity = S.playing ? .5 : 1;
    const h = $('hint'); if(h) h.style.opacity = S.playing ? 0 : .7;
    this.readout();
  }
};


/* ============================ tracks ============================
   One row per voice, eight bars across, eight LEDs per bar (eighth notes).
   A bright LED is a note that started on that step. A dim LED is the
   voice's level during that step, read from its own analyser, so held
   pads and drones show as glowing runs. The playhead overwrites as it
   goes; what is to its right is the last pass, drawn as a ghost. */
const TRACK_LABELS = Object.assign({}, LAYER_LABELS, { fx:'Swells' });
const LAYER_EL = {};
const TRK = {
  show:true, docked:false, rh:15, hh:18, steps:64,
  grid:{}, env:{}, lvl:{}, flash:{}, act:{}, head:new Array(8).fill(null),
  evq:[], barlog:[], phKey:-1, lastStep:-1, rows:{}, buf:new Float32Array(512),
  cv:null, cx:null, W:0, H:0
};
TRACK_KEYS.forEach(k => {
  TRK.grid[k] = new Float32Array(TRK.steps); TRK.env[k] = new Float32Array(TRK.steps);
  TRK.lvl[k] = 0; TRK.flash[k] = 0; TRK.act[k] = -1;
});

function mark(k, t, v){
  if(!TRK.show || !isOn(k)) return;
  TRK.evq.push({ k, at:t, v:clamp(v, 0, 1) });
  if(TRK.evq.length > 400) TRK.evq.splice(0, TRK.evq.length - 400);
}

function saveMix(){
  try{ localStorage.setItem(MIX_KEY, JSON.stringify({ layers:LAYERS, trim:TRIM, show:TRK.show })); }catch(e){}
}
function loadMix(){
  try{
    const m = JSON.parse(localStorage.getItem(MIX_KEY) || 'null');
    if(!m) return;
    TRACK_KEYS.forEach(k => {
      if(m.trim && typeof m.trim[k] === 'number') TRIM[k] = clamp(m.trim[k], 0, TRIM_MAX);
      if(m.layers && typeof m.layers[k] === 'boolean') LAYERS[k] = m.layers[k];
    });
    if(typeof m.show === 'boolean') TRK.show = m.show;
  }catch(e){}
}

function setLayer(k, on){
  LAYERS[k] = on;
  const c = LAYER_EL[k];
  if(c){ c.inp.checked = on; c.l.classList.toggle('on', on); }
  syncTracks();
  applyMix(.06, k);
  saveMix();
}
function toggleSolo(k){
  SOLO[k] = !SOLO[k];
  syncTracks();
  applyMix(.06);
}
function resetMix(){
  TRACK_KEYS.forEach(k => { LAYERS[k] = true; TRIM[k] = 1; SOLO[k] = false; });
  Object.keys(LAYER_EL).forEach(k => { LAYER_EL[k].inp.checked = true; LAYER_EL[k].l.classList.add('on'); });
  syncTracks();
  applyMix(.1);
  saveMix();
}
function showTracks(on){
  TRK.show = on;
  $('tracksBtn').textContent = on ? 'Hide tracks' : 'Show tracks';
  if(!on) TRK.evq.length = 0;
  layoutTracks();
  saveMix();
}

function buildTracks(){
  const el = $('tracks');
  TRACK_KEYS.forEach((k, i) => {
    const left = document.createElement('div');
    left.className = 'tcell tl'; left.style.gridRow = i + 2;
    const mute = document.createElement('button');
    mute.className = 'tmute';
    mute.setAttribute('role', 'switch');
    mute.innerHTML = '<span class="tled"></span><span class="tname">' + TRACK_LABELS[k] + '</span>';
    mute.onclick = () => setLayer(k, !LAYERS[k]);
    const solo = document.createElement('button');
    solo.className = 'tsolo'; solo.textContent = 's';
    solo.setAttribute('aria-label', 'Solo ' + TRACK_LABELS[k]);
    solo.title = 'Solo ' + TRACK_LABELS[k];
    solo.onclick = () => toggleSolo(k);
    left.appendChild(mute); left.appendChild(solo);

    const right = document.createElement('div');
    right.className = 'tcell tr'; right.style.gridRow = i + 2;
    const fader = document.createElement('input');
    fader.type = 'range'; fader.min = 0; fader.max = TRIM_MAX; fader.step = .01; fader.value = TRIM[k];
    fader.setAttribute('aria-label', TRACK_LABELS[k] + ' level');
    fader.oninput = () => {
      TRIM[k] = parseFloat(fader.value);
      fader.title = TRACK_LABELS[k] + ' ' + Math.round(TRIM[k] * 100);
      applyMix(.05, k);
      saveMix();
    };
    fader.ondblclick = () => { fader.value = 1; fader.oninput(); };
    fader.title = TRACK_LABELS[k] + ' ' + Math.round(TRIM[k] * 100) + ' (double-click for 100)';
    right.appendChild(fader);

    el.appendChild(left); el.appendChild(right);
    TRK.rows[k] = { left, mute, solo, fader };
  });
  $('mixReset').onclick = resetMix;
  TRK.cv = $('grid');
  TRK.cx = TRK.cv.getContext('2d');
  $('tracksBtn').textContent = TRK.show ? 'Hide tracks' : 'Show tracks';
  syncTracks();
  if(window.ResizeObserver) new ResizeObserver(() => layoutTracks()).observe($('console'));
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutTracks);
}

function syncTracks(){
  TRACK_KEYS.forEach(k => {
    const r = TRK.rows[k];
    if(!r) return;
    const on = LAYERS[k] !== false;
    r.mute.classList.toggle('on', on);
    r.mute.setAttribute('aria-checked', String(on));
    r.mute.title = (on ? 'Mute ' : 'Unmute ') + TRACK_LABELS[k];
    r.solo.classList.toggle('on', !!SOLO[k]);
    r.solo.setAttribute('aria-pressed', String(!!SOLO[k]));
    r.left.classList.toggle('silent', !isOn(k));
    r.fader.value = TRIM[k];
  });
}

/* the panel floats in the empty middle between the title and the console.
   on small screens there is no middle, so it docks into the console. */
function layoutTracks(){
  const el = $('tracks'), con = $('console'), hint = $('hint');
  if(!el || !TRK.cv) return;
  const n = TRACK_KEYS.length, hh = 18, chrome = 22;

  /* measure the empty middle with the panel out of the console */
  if(el.parentNode !== document.body) document.body.insertBefore(el, con);
  el.classList.remove('docked');
  const np = $('nowplaying').getBoundingClientRect();
  const bottomMax = con.getBoundingClientRect().top + 14;
  const fit = topMin => {
    const avail = bottomMax - topMin;
    return { topMin, avail, rh:Math.floor((avail - hh - chrome) / n) };
  };
  let f = fit(np.top + 36), tight = false;
  if(f.rh < 13){
    /* not much room: give up the now-playing line and sit right under the title */
    const g = fit($('sub').getBoundingClientRect().bottom + 16);
    if(g.rh > f.rh){ f = g; tight = true; }
  }
  const docked = innerWidth <= 860 || f.rh < 11;
  TRK.docked = docked;
  if(docked){ con.insertBefore(el, con.children[1]); tight = false; }
  el.classList.toggle('docked', docked);
  el.classList.toggle('off', !TRK.show);
  document.body.classList.toggle('tight', TRK.show && tight);
  hint.style.top = ''; hint.style.bottom = ''; hint.style.display = '';
  if(!TRK.show) return;

  let rh = 14;
  if(!docked){
    rh = clamp(f.rh, 11, 17);
    const h = hh + n * rh + chrome;
    el.style.top = Math.round(f.topMin + Math.max(0, (f.avail - h) * .3)) + 'px';
    /* the start-up hint moves into the now-playing slot, which is empty until you press play */
    if(tight) hint.style.display = 'none';
    else { hint.style.top = np.top + 'px'; hint.style.bottom = 'auto'; }
  }else{
    el.style.top = '';
  }
  TRK.rh = rh; TRK.hh = hh;
  el.style.setProperty('--rh', rh + 'px');
  el.style.setProperty('--hh', hh + 'px');
  const H = hh + n * rh;
  TRK.cv.style.height = H + 'px';
  const W = TRK.cv.clientWidth;
  TRK.W = W; TRK.H = H;
  TRK.cv.width = Math.max(1, W * DPR); TRK.cv.height = H * DPR;
  TRK.cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const LED_OFF = [185, 207, 225];
/* LEDs follow the mood like the rest of the app, but stay saturated so they read as LEDs:
   ice blue when cold, amber when warm, pulled toward red as tension rises */
function ledColor(){
  const x = FIELD.x, w = x * x * (3 - 2 * x);                 /* short crossover in the middle */
  const base = mix3([80, 176, 255], [255, 150, 52], w);
  const c = mix3(base, [255, 70, 82], Math.pow(FIELD.y, 1.3) * .6);
  /* a straight RGB blend of blue and amber goes grey in the middle; push it back to full colour */
  const mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]);
  const k = mx - mn < 1 ? 1 : 165 / (mx - mn);
  return c.map(v => clamp(255 - (mx - v) * k, 80, 255));
}
function drawTracks(P0){
  if(!TRK.show || !TRK.cx || !TRK.W) return;
  const c = TRK.cx, W = TRK.W, rh = TRK.rh, hh = TRK.hh, N = TRK.steps;
  const live = !!(AC && S.playing && AC.state === 'running');
  const now = AC ? AC.currentTime : 0;

  /* ---- where is the playhead: the latest bar that has started ---- */
  let cur = null;
  if(live){
    for(let i = TRK.barlog.length - 1; i >= 0; i--){
      const b = TRK.barlog[i];
      if(b.t <= now){ if(now < b.t + b.dur + .05) cur = b; break; }
    }
  }
  let step = -1;
  if(cur){
    const s8 = clamp(Math.floor((now - cur.t) / (cur.dur / 8)), 0, 7);
    const slot = ((cur.abs % 8) + 8) % 8;
    step = slot * 8 + s8;
    const key = cur.abs * 8 + s8;
    if(key !== TRK.phKey){
      TRK.phKey = key;
      TRACK_KEYS.forEach(k => { TRK.grid[k][step] = 0; TRK.env[k][step] = 0; });
      const h = TRK.head[slot];
      if(!h || h.abs !== cur.abs) TRK.head[slot] = { abs:cur.abs, label:cur.start ? cur.label : '' };
    }
    TRK.lastStep = step;
  }

  /* ---- note-ons that have now sounded ---- */
  if(TRK.evq.length){
    const keep = [];
    for(const ev of TRK.evq){
      if(ev.at > now){ keep.push(ev); continue; }
      if(step >= 0 && isOn(ev.k)){
        TRK.grid[ev.k][step] = Math.max(TRK.grid[ev.k][step], .62 + ev.v * .38);
        TRK.flash[ev.k] = 1;
      }
    }
    TRK.evq = keep;
  }

  /* ---- per-track meters: fast attack, slow fall, like a real LED bar ---- */
  TRACK_KEYS.forEach(k => {
    let v = 0;
    const b = BUS[k];
    if(live && b && b.an){
      b.an.getFloatTimeDomainData(TRK.buf);
      let pk = 0;
      for(let i = 0; i < TRK.buf.length; i++){ const a = Math.abs(TRK.buf[i]); if(a > pk) pk = a; }
      v = clamp((20 * Math.log10(pk + 1e-7) + 60) / 57, 0, 1);
    }
    const L = TRK.lvl[k];
    TRK.lvl[k] = v > L ? v : L + (v - L) * .07;
    if(step >= 0) TRK.env[k][step] = Math.max(TRK.env[k][step], TRK.lvl[k]);
    TRK.flash[k] *= .9;
    /* the row's own LED blinks with activity */
    const a = Math.round(Math.max(TRK.flash[k], TRK.lvl[k] * .55) * 20) / 20;
    if(a !== TRK.act[k] && TRK.rows[k]){ TRK.act[k] = a; TRK.rows[k].left.style.setProperty('--act', a); }
  });

  /* ---- geometry ---- */
  const meterW = Math.min(44, W * .08), mgap = 10;
  const gridW = W - meterW - mgap;
  const barGap = Math.max(4, gridW * .011);
  const cellW = (gridW - barGap * 7) / N;
  const slotW = cellW * 8;
  const ledW = Math.max(1.5, cellW - Math.max(1.2, cellW * .3));
  const ledH = Math.max(4, rh - 7);
  const xOf = j => Math.floor(j / 8) * (slotW + barGap) + (j % 8) * cellW;
  const ref = TRK.lastStep;
  const refSlot = ref >= 0 ? Math.floor(ref / 8) : -1;
  const ice = mix3(P0.cool, [235, 231, 222], .35);
  const fog = [97, 112, 138];
  const acc = ledColor();
  const hot = mix3(acc, [255, 246, 236], .3);

  c.clearRect(0, 0, W, TRK.H);

  /* ---- header: bar numbers, and the chord where it changes ---- */
  c.font = '400 10px Jost, sans-serif';
  c.textBaseline = 'middle';
  for(let s = 0; s < 8; s++){
    const x = s * (slotW + barGap);
    const h = TRK.head[s];
    const isCur = live && s === refSlot;
    const ghost = ref >= 0 && s > refSlot;
    const num = h ? String(h.abs + 1) : String(s + 1);
    c.fillStyle = isCur ? rgb(ice, .95) : rgb(fog, ghost || !h ? .45 : .85);
    c.fillText(num, x, hh * .42);
    if(h && h.label){
      const nx = x + c.measureText(num).width + 6;
      if(nx + c.measureText(h.label).width < x + slotW){
        c.fillStyle = isCur ? rgb(acc, .9) : rgb(ice, ghost ? .28 : .55);
        c.fillText(h.label, nx, hh * .42);
      }
    }
    if(isCur){
      c.fillStyle = rgb(acc, .5);
      c.fillRect(x, hh - 4, slotW - (cellW - ledW), 1);
    }
  }

  /* ---- playhead column, behind the LEDs ---- */
  if(live && step >= 0){
    c.fillStyle = rgb(ice, .075);
    c.fillRect(xOf(step) - 1.5, hh - 2, ledW + 3, TRACK_KEYS.length * rh + 2);
  }

  /* ---- the LEDs ---- */
  TRACK_KEYS.forEach((k, r) => {
    const y = hh + r * rh + (rh - ledH) / 2;
    const on = isOn(k);
    const g = TRK.grid[k], e = TRK.env[k];
    for(let j = 0; j < N; j++){
      const x = xOf(j);
      const off = (j % 8 === 0 ? .12 : (j % 2 === 0 ? .075 : .05)) * (on ? 1 : .5);
      const ev = e[j] < .4 ? 0 : (e[j] < .66 ? .2 : .36);
      let v = on ? Math.max(g[j], ev) : 0;
      if(ref >= 0 && j > ref) v *= .36;            /* last pass, not yet overwritten */
      if(v <= .01){
        c.fillStyle = rgb(LED_OFF, off);
        c.fillRect(x, y, ledW, ledH);
        continue;
      }
      c.fillStyle = 'rgb(9,12,20)';
      c.fillRect(x, y, ledW, ledH);
      c.fillStyle = rgb(v > .9 ? hot : acc, (.2 + v * .8).toFixed(3));
      c.fillRect(x, y, ledW, ledH);
      if(v > .55){
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = rgb(acc, (.14 * v).toFixed(3));
        c.fillRect(x - 1.5, y - 1.5, ledW + 3, ledH + 3);
        c.globalCompositeOperation = 'source-over';
      }
    }

    /* level meter: six segments, the last one warns */
    const mx = W - meterW, segs = 6, sg = 2;
    const sw = (meterW - (segs - 1) * sg) / segs;
    for(let s = 0; s < segs; s++){
      const lit = on && TRK.lvl[k] > (s + .5) / segs;
      const col = s === segs - 1 ? [255, 70, 82] : acc;
      c.fillStyle = lit ? rgb(col, .92) : rgb(LED_OFF, .06);
      c.fillRect(mx + s * (sw + sg), y, sw, ledH);
    }
  });
}

/* ============================ link to the separate beat machine ============================
   Deep Field is the musical source of truth. beat_machine.html follows BPM + key
   over the same subdivision-link channel it already understands. */
const LINK = { chan:null, me:Math.random().toString(36).slice(2) };
try{ LINK.chan = new BroadcastChannel('subdivision-link'); }catch(e){}
function linkSend(msg){
  msg.src = LINK.me; msg.ts = Date.now();
  try{ LINK.chan && LINK.chan.postMessage(msg); }catch(e){}
  try{ localStorage.setItem('subdivision-link', JSON.stringify(msg)); }catch(e){}
}
function linkState(){
  linkSend({ t:'bpm', v:clamp(P.bpm, 40, 120) });
  linkSend({ t:'key', v:S.root });
}
function linkRecv(msg){
  if(!msg || msg.src === LINK.me) return;
  /* The external rhythm app may announce itself; answer with Deep Field's state
     rather than letting percussion choices rewrite the harmonic engine. */
  if(msg.t === 'bpm' || msg.t === 'key') setTimeout(linkState, 0);
}
if(LINK.chan) LINK.chan.onmessage = e => linkRecv(e.data);
addEventListener('storage', e => {
  if(e.key === 'subdivision-link' && e.newValue){
    try{ linkRecv(JSON.parse(e.newValue)); }catch(err){}
  }
});

/* ---------- recording ---------- */
let recorder = null, chunks = [], recStart = 0, recTimer = null;
function toggleRec(){
  if(!AC) play();
  const btn = $('recBtn');
  if(recorder && recorder.state === 'recording'){
    recorder.stop();
    clearInterval(recTimer); recTimer = null;
    btn.classList.remove('live');
    btn.textContent = 'Record';
    return;
  }
  try{
    chunks = [];
    recorder = new MediaRecorder(recDest.stream, { mimeType:'audio/webm' });
    recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type:'audio/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = S.title.replace(/\s+/g, '-').toLowerCase() + '.webm';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    recorder.start();
    recStart = Date.now();
    btn.classList.add('live');
    const fmt = () => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      btn.textContent = 'Stop and save · ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    };
    fmt();
    recTimer = setInterval(fmt, 1000);
  }catch(err){
    btn.textContent = 'Recording unavailable in this browser';
  }
}

/* ---------- boot ---------- */
loadMix();
resize();
UI.build();
buildTracks();
layoutTracks();
newPiece();
UI.sync();
draw();
$('title').innerHTML = 'Deep <i>Field</i>';
$('sub').textContent = 'pads, harmony and melody — rhythm lives next door';
linkState();

</script>
